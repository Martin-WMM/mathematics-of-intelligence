name: Deploy book

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "book/**"
      - ".github/workflows/deploy-book.yml"
      - ".github/scripts/publish_book_pdfs.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-book
  cancel-in-progress: true

jobs:
  deploy-book:
    name: deploy-book
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            book:
              - 'book/**'
              - '.github/workflows/deploy-book.yml'
              - '.github/scripts/publish_book_pdfs.sh'
      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.book }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No book changes in the merged pull request."
          fi
      - name: Compile light and dark PDFs
        if: steps.publish.outputs.run == 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          # The book uses tcolorbox and its skin/breakable libraries. The
          # small scheme omits tcolorbox, so use the complete TeX Live image
          # for reproducible CI builds of both editions.
          scheme: full
          run: bash book/scripts/build.sh all
      - name: Publish PDFs to Git LFS
        if: steps.publish.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          bash .github/scripts/publish_book_pdfs.sh \
            book/build/book-light.pdf \
            book/build/book-dark.pdf \
            "$GITHUB_TOKEN"
