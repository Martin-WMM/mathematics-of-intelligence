name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy-web:
    name: deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Build
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish deploy/web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy/web
          publish_dir: website/apps/web/dist
          force_orphan: true
          commit_message: "📦[website][build]: publish production site"
