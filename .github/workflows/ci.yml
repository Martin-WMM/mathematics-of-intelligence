name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve revision range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin main || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "range=HEAD" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint messages and sizes
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "${ACTOR}" = "dependabot[bot]" ] || [[ "${HEAD_REF}" == dependabot/* ]]; then
            echo "OK: Dependabot commits skip the repository commit format"
            exit 0
          fi
          python .github/scripts/check_push_range.py --range "${{ steps.range.outputs.range }}"

  branch:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python .github/scripts/check_branch_name.py --name "${BRANCH_NAME}"

  website:
    name: website-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.website == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.website == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install and build
        if: steps.filter.outputs.website == 'true'
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @moi/web exec vue-tsc --noEmit
          pnpm build
