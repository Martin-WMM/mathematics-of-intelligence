[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moi-manim"
version = "0.1.0"
description = "Manim helpers and scenes for Mathematics of Intelligence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "manim>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]
